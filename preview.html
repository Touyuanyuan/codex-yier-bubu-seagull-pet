<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>牵手海鸥一二布布 · 动画预览</title>
<style>
:root{color-scheme:light;font-family:"Microsoft YaHei",system-ui,sans-serif;color:#4b3027;background:#f5f0ea}*{box-sizing:border-box}body{margin:0;padding:30px 18px}main{max-width:1060px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{line-height:1.7;color:#79675f}.layout{display:grid;grid-template-columns:minmax(280px,440px) 1fr;gap:28px;margin-top:24px}.panel{background:#fffaf4;border:1px solid #e5d8ca;border-radius:20px;padding:20px}button,select{font:inherit;border:1px solid #d5c3b2;background:#fffaf5;color:inherit;border-radius:10px;padding:10px 13px;cursor:pointer}button.active{background:#674536;color:white;border-color:#674536}button:focus-visible,select:focus-visible{outline:3px solid #d9a652;outline-offset:2px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.states{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stage{width:100%;max-width:384px;aspect-ratio:192/208;margin:auto;position:relative;border:1px solid #e2d8ce;border-radius:16px;overflow:hidden;background-color:#f6f1ec;background-image:linear-gradient(45deg,#e6ddd4 25%,transparent 25%),linear-gradient(-45deg,#e6ddd4 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e6ddd4 75%),linear-gradient(-45deg,transparent 75%,#e6ddd4 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}.stage.dark{background-color:#211d23;background-image:linear-gradient(45deg,#37303b 25%,transparent 25%),linear-gradient(-45deg,#37303b 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#37303b 75%),linear-gradient(-45deg,transparent 75%,#37303b 75%)}.stage.clear{background:none;border-style:dashed}canvas{display:block;width:100%;height:100%;object-fit:contain}.gaze{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.gaze button{padding:8px;font-size:13px}.label{font-size:14px;margin:14px 0 9px}.status{min-height:42px;font-size:14px;line-height:1.6;text-align:center;margin:12px 0 0}.small{font-size:12px;color:#8a766b}.error{color:#b03925}@media(max-width:720px){.layout{grid-template-columns:1fr}body{padding:20px 12px}.panel{padding:15px}h1{font-size:21px}}
</style>
<main>
<h1>牵手海鸥一二布布 · 脚色修正版</h1>
<p>待机睁眼与眯眼笑交替，小跳腾空时一起眯眼笑。九种动作与十六个注视方向。画面直接读取最终图集，保持原始比例。</p>
<div class="layout">
<section class="panel"><div id="stage" class="stage"><canvas id="canvas" width="384" height="416" aria-label="桌宠动画预览"></canvas></div><div id="status" class="status">正在读取最终图集…</div><p class="small">浅色／深色棋盘用于检查透明边缘。此页是本地预览，不安装桌宠。</p></section>
<section class="panel">
<div class="controls"><button id="play">暂停</button><button id="restart">从头播放</button><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value="0.5">慢速 ×0.5</option><option value="0.25">慢速 ×0.25</option></select></div>
<div class="controls"><button data-bg="light" class="active">浅色透明底</button><button data-bg="dark">深色透明底</button><button data-bg="clear">无棋盘</button></div>
<div class="label">动作</div><div id="states" class="states"></div>
<div class="controls" style="margin-top:12px"><button id="transition">待机 → 小跳 → 待机</button><button id="mouse">鼠标注视：关闭</button></div>
<div class="label">注视方向（屏幕坐标，0°向上，顺时针）</div><div id="gaze" class="gaze"></div>
<p class="small">鼠标注视开启后，在左侧预览区移动鼠标。每个动作使用实际生成帧；注视模式显示所选方向。</p>
</section></div>
</main>
<script>
const states=[
{id:'idle',name:'待机',row:0,d:[600,400,450,550,300,700]},
{id:'running-right',name:'向右移动',row:1,d:[120,120,120,120,120,120,120,120]},
{id:'running-left',name:'向左移动',row:2,d:[120,120,120,120,120,120,120,120]},
{id:'waving',name:'招手',row:3,d:[180,200,240,200]},
{id:'jumping',name:'小跳',row:4,d:[160,120,180,140,220]},
{id:'failed',name:'失败反应',row:5,d:[180,180,220,280,240,220,200,280]},
{id:'waiting',name:'等待回应',row:6,d:[280,240,320,400,240,320]},
{id:'running',name:'双电脑工作',row:7,d:[180,180,180,180,180,180]},
{id:'review',name:'查看成果',row:8,d:[240,240,280,240,280,320]}];
const names=['上','右上','右上','右上','右','右下','右下','右下','下','左下','左下','左下','左','左上','左上','左上'];
const $=id=>document.getElementById(id),ctx=$('canvas').getContext('2d'),atlas=new Image();
let loaded=false,playing=true,mode='state',state=0,gaze=0,elapsed=0,last=0,mouse=false;
const transition=[...states[0].d.map((d,c)=>({r:0,c,d})),...states[4].d.map((d,c)=>({r:4,c,d})),...states[0].d.map((d,c)=>({r:0,c,d}))];
states.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.name;b.dataset.state=i;b.onclick=()=>{state=i;mode='state';elapsed=0;setMouse(false);mark()};$('states').appendChild(b)});
names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=`${i*22.5}° ${n}`;b.dataset.gaze=i;b.onclick=()=>{gaze=i;mode='gaze';setMouse(false);mark()};$('gaze').appendChild(b)});
function setMouse(value){mouse=value;$('mouse').textContent='鼠标注视：'+(mouse?'开启':'关闭');$('mouse').classList.toggle('active',mouse)}
function mark(){document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('active',mode==='state'&&+b.dataset.state===state));document.querySelectorAll('[data-gaze]').forEach(b=>b.classList.toggle('active',mode==='gaze'&&+b.dataset.gaze===gaze));$('transition').classList.toggle('active',mode==='transition')}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};
$('restart').onclick=()=>{elapsed=0};$('transition').onclick=()=>{mode='transition';elapsed=0;setMouse(false);mark()};
$('mouse').onclick=()=>{setMouse(!mouse);if(mouse){mode='gaze';mark()}};
$('stage').addEventListener('pointermove',event=>{if(!mouse)return;const box=$('stage').getBoundingClientRect(),dx=event.clientX-(box.left+box.width/2),dy=event.clientY-(box.top+box.height/2);if(Math.hypot(dx,dy)<12)return;const angle=(Math.atan2(dx,-dy)*180/Math.PI+360)%360;gaze=Math.round(angle/22.5)%16;mode='gaze';mark()});
document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{$('stage').className='stage '+(b.dataset.bg==='light'?'':b.dataset.bg);document.querySelectorAll('[data-bg]').forEach(x=>x.classList.toggle('active',x===b))});
function currentFrame(){if(mode==='gaze')return{r:9+Math.floor(gaze/8),c:gaze%8,label:`注视 ${gaze*22.5}° · ${names[gaze]}`};let seq=mode==='transition'?transition:states[state].d.map((d,c)=>({r:states[state].row,c,d}));let t=elapsed%seq.reduce((a,v)=>a+v.d,0),i=0;while(t>=seq[i].d){t-=seq[i].d;i++}const f=seq[i];return{...f,label:`${states[f.r].name} · 第 ${f.c+1} 帧`}}
function draw(timestamp){if(last&&playing)elapsed+=Math.min(timestamp-last,100)*Number($('speed').value);last=timestamp;if(loaded){const f=currentFrame();ctx.clearRect(0,0,384,416);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(atlas,f.c*192,f.r*208,192,208,0,0,384,416);$('status').textContent=f.label+(playing?'':' · 已暂停')}requestAnimationFrame(draw)}
atlas.onload=()=>{if(atlas.naturalWidth!==1536||atlas.naturalHeight!==2288){$('status').innerHTML='<span class="error">图集尺寸应为 1536×2288。</span>';return}loaded=true};
atlas.onerror=()=>{if(atlas.src.endsWith('.webp'))atlas.src='pet/spritesheet.webp';else $('status').innerHTML='<span class="error">最终图集尚未生成。完成组装后重新打开此页。</span>'};
atlas.src='pet/spritesheet.webp';mark();requestAnimationFrame(draw);
</script>
</html>
